<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Blog — KYLE</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <!-- Open Graph -->
  <meta property="og:title" content="Blog — KYLE">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://leejaekyo.netlify.app/blog.html">
  <meta property="og:image" content="https://leejaekyo.netlify.app/assets/images/OG Image.png">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog — KYLE">
  <meta name="twitter:image" content="https://leejaekyo.netlify.app/assets/images/OG Image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/blog-page.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/cursor-light.css">
</head>

<body>
  <div id="cursorLight" aria-hidden="true"></div>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="logo" href="/" aria-label="KYLE — Home">
        <img src="/assets/images/header-logo.svg" alt="KYLE" class="logo-img">
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="/#works" class="nav-link">Works <span class="works-count"></span></a>
        <a href="/about" class="nav-link">About</a>
        <a href="/blog" class="nav-link nav-link--active">Blog</a>
      </nav>
      <div class="header-contact">
        <a href="mailto:librekylee327@gmail.com">librekylee327@gmail.com</a>
        <a href="tel:+821088358992">+(82) 10 - 8835 - 8992</a>
      </div>
      <div class="header-role">
        <span>Product Designer</span>
        <span>Founder</span>
      </div>
      <button class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-hidden="true" aria-label="Mobile navigation">
      <a href="/#works">Works <span class="works-count"></span></a>
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
    </nav>
  </header>

  <main class="blog-page">
    <div class="blog-page-inner">

      <!-- ─── Intro ─────────────────────────────────────────────── -->
      <section class="bp-intro" aria-labelledby="bp-title">
        <h1 class="bp-title" id="bp-title">Blog</h1>
        <p class="bp-desc">창업을 준비하면서 경험한 이벤트, 고민, 인사이트 등을 기록하는 공간입니다. 창업 경험과 더해 서비스를 빌딩하면서 느낀 프로덕트 디자이너의 인사이트, 생각들도 기록합니다.</p>
      </section>

      <!-- ─── Post List ─────────────────────────────────────────── -->
      <section class="bp-posts" aria-labelledby="bp-posts-heading">
        <h2 class="bp-section-heading" id="bp-posts-heading">All Posts</h2>
        <!-- 카드는 js/posts.js 데이터로 js/blog.js 가 렌더 -->
        <div class="bp-posts-grid"></div>
      </section>

    </div>
  </main>

  <!-- ─── Post overlay layer (blog 위로 슬라이드업, GNB 아래 레이어) ─── -->
  <div class="post-layer" id="postLayer" aria-hidden="true" role="dialog" aria-label="Blog post">
    <div class="post-page-inner">
      <article class="post-article">
        <header class="post-header">
          <a href="blog.html" class="post-back" data-close>&lsaquo; Back to Blog</a>
          <div class="post-meta">
            <span class="post-date"></span>
            <span class="post-tag"></span>
          </div>
          <h1 class="post-title"></h1>
        </header>
        <div class="post-body"></div>
      </article>
    </div>
  </div>

  <script src="js/header.js"></script>
  <script src="js/cursor-light.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/blog.js"></script>
</body>

</html>
